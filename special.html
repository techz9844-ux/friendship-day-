<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>A Secret</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;background:#090b1a;color:#fff;position:relative}
body:before{content:'';position:absolute;width:200%;height:200%;
background:radial-gradient(circle,#ff4d6d55 0,transparent 30%),radial-gradient(circle,#00d4ff55 20%,transparent 35%),radial-gradient(circle,#7c5cff55 60%,transparent 30%);
filter:blur(80px);animation:aurora 18s linear infinite}
@keyframes aurora{0%{transform:translate(-10%,-10%) rotate(0)}100%{transform:translate(10%,10%) rotate(360deg)}}
.card{position:relative;z-index:2;background:rgba(255,255,255,.08);backdrop-filter:blur(14px);padding:30px;border-radius:20px;width:90%;max-width:520px;text-align:center}
#text{min-height:120px;font-size:22px}
button{display:none;margin-top:20px;padding:14px 28px;border:none;border-radius:30px;background:#ff4d6d;color:#fff;box-shadow:0 0 20px #ff4d6d}
.heart{position:absolute;bottom:-30px;color:#ff4d6d;animation:float linear forwards}
@keyframes float{to{transform:translateY(-120vh);opacity:0}}
</style></head><body><div class='card'><h2>🤫 A Little suprise</h2><div id='text'></div><button id='b' onclick="location.href='surprise.html'">Continue ✨</button></div><script>
const msg='There is an special gift for you on this special day ... hope( you will like it ';
let i=0,t=document.getElementById('text'),b=document.getElementById('b');
const iv=setInterval(()=>{t.textContent+=msg[i++]||'';if(i>msg.length){clearInterval(iv);b.style.display='inline-block';}},35);
setInterval(()=>{let h=document.createElement('div');h.className='heart';h.innerHTML='❤';h.style.left=Math.random()*100+'vw';h.style.fontSize=(15+Math.random()*20)+'px';h.style.animationDuration=(5+Math.random()*5)+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),10000)},300);
</script></body></html>
