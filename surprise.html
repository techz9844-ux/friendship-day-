<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Surprise</title><style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:#0b1020;color:#fff;font-family:Arial;overflow:hidden}
body:before{content:'';position:fixed;inset:-50%;background:radial-gradient(circle,#ff4d6d55,transparent 30%),radial-gradient(circle,#6c63ff55,transparent 30%),radial-gradient(circle,#00d4ff55,transparent 30%);filter:blur(80px);animation:a 16s linear infinite}
@keyframes a{to{transform:rotate(360deg) translate(5%,5%)}}
.card{position:relative;z-index:1;text-align:center;background:rgba(255,255,255,.08);padding:30px;border-radius:20px}
.gift{font-size:90px;cursor:pointer;animation:b 1.5s infinite}
@keyframes b{50%{transform:translateY(-12px) scale(1.05)}}
#pop{display:none;margin-top:20px}
button{padding:12px 24px;border:none;border-radius:24px;background:#ff4d6d;color:#fff}
</style></head><body><div class='card'><h2>One Last Surprise...</h2><div class='gift' onclick='openGift()'>🎁</div><div id='pop'><p>Not everything precious comes wrapped in paper...<br>The real surprise is still waiting ahead.</p><button onclick="location.href='letter.html'">Continue ➜</button></div></div><script>
function openGift(){document.getElementById('pop').style.display='block';for(let i=0;i<80;i++){let c=document.createElement('div');c.textContent=['🎉','✨','💖'][i%3];c.style.position='fixed';c.style.left=Math.random()*100+'vw';c.style.top=Math.random()*100+'vh';c.style.fontSize='24px';document.body.appendChild(c);setTimeout(()=>c.remove(),1500);}}
</script></body></html>
