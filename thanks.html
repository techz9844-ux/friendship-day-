<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Thank You</title><style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:#090b1a;color:#fff;font-family:Arial;overflow:hidden}
body:before{content:'';position:fixed;inset:-50%;background:radial-gradient(circle,#ff4d6d55,transparent 30%),radial-gradient(circle,#00d4ff55,transparent 35%),radial-gradient(circle,#7c5cff55,transparent 30%);filter:blur(80px);animation:r 18s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
.card{position:relative;z-index:1;background:rgba(255,255,255,.08);padding:35px;border-radius:22px;text-align:center;width:90%;max-width:650px}
.heart{font-size:110px;animation:p 1.2s infinite}@keyframes p{50%{transform:scale(1.15)}}
#confetti span{position:fixed;font-size:24px;animation:f 4s linear forwards}
@keyframes f{to{transform:translateY(120vh) rotate(720deg);opacity:0}}
</style></head><body><div id='confetti'></div><div class='card'><div class='heart'>❤️</div><h1>Thank You</h1><p>Thank you for taking this little journey with me. Whether your answer is today or someday, I truly appreciate your time, your smile, and every moment we shared through this surprise. You made this journey meaningful. ✨</p><h2>Have a Beautiful Day! 🌸</h2></div><script>
for(let i=0;i<120;i++){let s=document.createElement('span');s.textContent=['🎉','✨','💖','❤️'][i%4];s.style.left=Math.random()*100+'vw';s.style.top='-20px';s.style.animationDelay=(Math.random()*2)+'s';document.getElementById('confetti').appendChild(s);}
</script></body></html>
