<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Letter</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{height:100vh;display:flex;justify-content:center;align-items:center;background:#090b1a;color:#fff;overflow:hidden}
body:before{content:'';position:fixed;inset:-50%;background:radial-gradient(circle,#ff4d6d55,transparent 30%),radial-gradient(circle,#00d4ff55,transparent 35%),radial-gradient(circle,#7c5cff55,transparent 30%);filter:blur(80px);animation:a 18s linear infinite}
@keyframes a{to{transform:rotate(360deg)}}
.card{position:relative;z-index:1;width:90%;max-width:600px;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);padding:30px;border-radius:20px}
#msg{min-height:180px;line-height:1.8}
button{display:none;margin-top:20px;padding:12px 24px;border:none;border-radius:24px;background:#ff4d6d;color:#fff}
</style></head><body><div class='card'><h2>💌 A Letter</h2><div id='msg'></div><button id='btn' onclick="location.href='game.html'">Continue ➜</button></div><script>
const text=`Sometimes, the most unexpected people become the most important ones. I don't know what you'll think after this journey, but I wanted to create something that would make you smile today.`;
let i=0,m=document.getElementById('msg'),b=document.getElementById('btn');
let t=setInterval(()=>{m.textContent+=text[i++]||'';if(i>text.length){clearInterval(t);b.style.display='inline-block';}},30);
</script></body></html>
