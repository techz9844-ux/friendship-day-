<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank You</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#000,#071b22,#00b8c9);overflow:hidden}
body:before{content:"";position:fixed;inset:-35%;background:radial-gradient(circle,#00ffff33,transparent 35%),radial-gradient(circle,#00bcd433,transparent 40%);filter:blur(90px);animation:r 22s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.card{position:relative;z-index:2;width:90%;max-width:620px;background:rgba(10,18,24,.78);border:1px solid rgba(0,255,255,.22);border-radius:26px;padding:40px;text-align:center;color:#eefcff;backdrop-filter:blur(16px)}
h1{font-size:44px;color:#00f5ff;text-shadow:0 0 15px #00f5ff;margin-bottom:18px}
.quote{border-left:4px solid #00f5ff;padding:14px 18px;margin:22px 0;background:rgba(255,255,255,.04);font-style:italic}
u{color:#9ff}
.btn{display:inline-block;margin-top:26px;padding:13px 30px;border-radius:28px;background:#00d4df;color:#001014;text-decoration:none;font-weight:bold;box-shadow:0 0 10px #00d4df}
.small{margin-top:20px;font-size:14px;color:#bfeff5}
</style></head><body>
<div class="card">
<h1>Thank You</h1>
<p><b>Friendship</b> is one of life's <u>greatest gifts</u>.</p>
<div class="quote">
<b>Thank you</b> for taking this little journey.<br><br>
May your days be filled with <b>kindness</b>, <b>laughter</b>, and unforgettable memories.
</div>
<p><b>Happy Friendship Day!</b></p>
<a class="btn" href="index.html">Start Again ↺</a>
<div class="small">Made with appreciation for every friend.</div>
</div></body></html>
