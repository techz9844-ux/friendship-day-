<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Proposal</title><style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:#090b1a;color:#fff;font-family:Arial;overflow:hidden}
body:before{content:'';position:fixed;inset:-50%;background:radial-gradient(circle,#ff4d6d55,transparent 30%),radial-gradient(circle,#6c63ff55,transparent 30%),radial-gradient(circle,#00d4ff55,transparent 30%);filter:blur(80px);animation:r 18s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
.card{position:relative;z-index:1;background:rgba(255,255,255,.08);padding:30px;border-radius:20px;text-align:center;width:90%;max-width:560px}
#heart{font-size:64px;animation:p 1.2s infinite}@keyframes p{50%{transform:scale(1.2)}}
button{padding:12px 24px;border:none;border-radius:25px;margin:10px;font-size:18px;cursor:pointer}
#yes{background:#ff4d6d;color:#fff}#no{background:#fff;color:#111;position:relative}
</style></head><body><div class='card'><div id='heart'>❤️</div><h1>I Have One Last Question...</h1><p>You made it to the end of this little journey. I hope it made you smile.</p><h2>Will you let me stay by your side as someone truly special? 💖</h2><button id='yes' onclick='location.href="thanks.html"'>Yes ❤️</button><button id='no'>Need More Time 🤭</button></div><script>
const n=document.getElementById('no');n.onmouseover=()=>{n.style.position='absolute';n.style.left=Math.random()*70+'%';n.style.top=Math.random()*70+'%';}
</script></body></html>
