<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friendship Day</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#000,#071b22,#00b8c9);overflow:hidden}body:before{content:"";position:fixed;inset:-30%;background:radial-gradient(circle,#00ffff33,transparent 35%),radial-gradient(circle,#00bcd433,transparent 40%);filter:blur(80px);animation:spin 20s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.card{position:relative;z-index:1;width:90%;max-width:560px;background:rgba(10,18,24,.75);border:1px solid rgba(0,255,255,.25);border-radius:24px;padding:35px;text-align:center;color:#eefcff}h1{color:#00f5ff;text-shadow:0 0 15px #00f5ff;margin-bottom:18px}p{line-height:1.8;font-size:18px}.btn{display:inline-block;margin-top:28px;padding:15px 34px;border-radius:32px;text-decoration:none;background:linear-gradient(90deg,#00f5ff,#00bcd4);color:#001014;font-weight:bold;box-shadow:0 0 18px #00ffff,0 0 45px #00ffff;animation:pulse 2s infinite}@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 30px #00ffff,0 0 60px #00ffff}}</style></head><body><div class="card"><h1>Happy Friendship Day</h1><p>May our friendship always bring<br>smiles,<br>support,<br>and unforgettable memories.<br><br><b>Happy Friendship Day!</b></p><a class="btn" href="thankyou.html">Finish the Journey →</a></div></body></html>
