<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Message</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#000,#071b22,#00b8c9);overflow:hidden}body:before{content:"";position:fixed;inset:-30%;background:radial-gradient(circle,#00ffff33,transparent 35%),radial-gradient(circle,#00bcd433,transparent 40%);filter:blur(80px);animation:spin 18s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.card{position:relative;z-index:1;width:90%;max-width:560px;background:rgba(10,18,24,.75);border:1px solid rgba(0,255,255,.25);border-radius:24px;padding:35px;text-align:center;color:#eefcff;animation:fade .8s}@keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}h1{color:#00f5ff;margin-bottom:18px;text-shadow:0 0 12px #00f5ff}p{line-height:1.8;font-size:18px}.btn{display:inline-block;margin-top:28px;padding:14px 30px;border-radius:30px;text-decoration:none;color:#001014;font-weight:bold;background:linear-gradient(90deg,#00f5ff,#00bcd4);box-shadow:0 0 15px #00e5ff,0 0 35px #00e5ff;animation:pulse 2s infinite}@keyframes pulse{50%{box-shadow:0 0 28px #00ffff,0 0 55px #00ffff;transform:scale(1.04)}}.dot{position:fixed;width:4px;height:4px;background:#7ffcff;border-radius:50%;animation:f 10s linear infinite}@keyframes f{from{transform:translateY(105vh)}to{transform:translateY(-10vh)}}</style></head><body><div class="card"><h1>Just Wanted to Say...</h1><p>I truly appreciate our friendship.<br><br>Thank you for being a part of my journey.<br><br>Stay exactly the way you are.</p><a class="btn" href="friendshipday.html">Almost There →</a></div><script>for(let i=0;i<30;i++){let d=document.createElement("div");d.className="dot";d.style.left=Math.random()*100+"vw";d.style.animationDelay=Math.random()*10+"s";document.body.appendChild(d);}</script></body></html>
